name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-build-smoke:
    name: Test, build, and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t ikano-calc:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d --name ikano-calc -p 8000:8000 ikano-calc:${{ github.sha }}

      - name: Wait for API to become ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/docs > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          docker logs ikano-calc
          exit 1

      - name: Smoke test Fibonacci endpoint
        run: |
          curl -fsS "http://localhost:8000/fibonacci?n=10" | python -c "import sys, json; assert json.load(sys.stdin) == {'n': 10, 'result': 55}"

      - name: Smoke test Factorial endpoint
        run: |
          curl -fsS "http://localhost:8000/factorial?n=5" | python -c "import sys, json; assert json.load(sys.stdin) == {'n': 5, 'result': 120}"

      - name: Smoke test Loan endpoint
        run: |
          curl -fsS -X POST "http://localhost:8000/loan" \
            -H "Content-Type: application/json" \
            -d '{"principal": 10000, "annual_rate": 5, "months": 12}' \
            | python -c "import sys, json; assert json.load(sys.stdin)['monthly_repayment'] == 856.07"

      - name: Show container logs on failure
        if: failure()
        run: docker logs ikano-calc || true

      - name: Stop container
        if: always()
        run: docker rm -f ikano-calc || true
