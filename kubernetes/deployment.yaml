apiVersion: apps/v1
kind: Deployment
metadata:
  name: ikano-calc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ikano-calc
  template:
    metadata:
      labels:
        app: ikano-calc
    spec:
      containers:
        - name: ikano-calc
          image: ikano-calc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ikano-calc
spec:
  selector:
    app: ikano-calc
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
